url: https://marcusharrisphd.com/mlmr/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#264653"
    secondary: "#6e7f8d"
    base_font:
      google: Source Sans Pro
    heading_font:
      google: Source Serif 4

navbar:
  structure:
    left: [intro, demo, reference, articles, news]
    right: [github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    demo:
      text: Demo
      href: DEMO.html
    articles:
      text: Articles
      menu:
      - text: Getting started
        href: articles/getting-started.html
      - text: Equations and reporting
        href: articles/equations-and-reporting.html

home:
  title: mlmr
  description: >
    Open-source mixed-effects and multilevel modeling in R with a guided Shiny
    interface, readable equations, APA-style tables, and reproducible exports.

reference:
- title: Package overview
  contents:
  - mlmr-package
- title: Launch the app
  contents:
  - run_mlmr
- title: Specify and fit models
  contents:
  - example_hsb
  - mlm_spec
  - mlm_formula
  - mlm_fit
- title: Report models
  contents:
  - mlm_apa_tables
  - mlm_software_table

articles:
- title: Tutorials
  navbar: ~
  contents:
  - getting-started
  - equations-and-reporting
