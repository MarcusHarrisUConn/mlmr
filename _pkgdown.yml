url: https://marcusharrisphd.com/mlmr/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#264653"
    secondary: "#6e7f8d"
    base_font:
      google: Source Sans Pro
    heading_font:
      google: Source Serif 4

navbar:
  structure:
    left: [intro, demo, beta, reference, articles, news]
    right: [github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    demo:
      text: Demo
      href: DEMO.html
    beta:
      text: Beta testing
      href: BETA_TESTING.html
    articles:
      text: Articles
      menu:
      - text: Getting started
        href: articles/getting-started.html
      - text: Supported models
        href: articles/supported-models.html
      - text: Equations and reporting
        href: articles/equations-and-reporting.html
      - text: Validation and benchmarks
        href: articles/validation-and-benchmarks.html

home:
  title: mlmr
  description: >
    Open-source mixed-effects and multilevel modeling in R with a guided
    level-by-level Shiny interface, live equations, APA-style tables, and
    reproducible exports.

